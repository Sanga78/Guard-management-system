{%include 'includes/auth_header.html' %}
<div class="container">

    <!-- Outer Row -->
    <div class="row justify-content-center mt-5 pt-5">
  
      <div class="col-xl-6 col-lg-7 col-md-9">
  
        <div class="card o-hidden border-0 shadow-lg my-5">
          <div class="card-body p-3">
            <!-- Nested Row within Card Body -->
            <div class="row">
              <div class="col-lg">
                <div class="p-5">
                  <div class="text-center">
                    <h1 class="h4 text-gray-900 mb-4">Guard Management System</h1>
                    <hr>
                  </div>
                  <form class="user" method="post" action="">
                    {% csrf_token %}
                    <div class="col-lg">
                      {% for m in messages %}
                      {% if m.tags == 'error' %}
                      
                      <div class="alert alert-danger alert-dismissible fade show"><strong>Info: </strong>{{m}}
                      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                          <span aria-hidden="true">&times;</span>
                      </button>
                  
                      </div>
                      {% elif m.tags == 'success' %}
                      <div class="alert alert-success alert-dismissible fade show"><strong>Info: </strong>{{m}}
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                       </div>
                       {%endif%}
                      {%endfor%}
          
                    </div>
                    <div class="form-group mt-4">
                      <input type="text" class="form-control form-control-user" name="username" placeholder="Enter Your Username or Email">
                    </div>
                    <div class="form-group mt-4 mb-4">
                      <input type="password" class="form-control form-control-user" name="password" placeholder="Password">
                    </div>
                    <button class="btn btn-info btn-user btn-block mt-4" type="submit">
                      Login
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
  
      </div>
  
    </div>
  
  </div>
{%include 'includes/auth_footer.html' %}
