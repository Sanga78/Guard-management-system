{% extends 'includes/base.html' %}
{% block main_content %}
<!-- Begin Page Content -->
<div class="container-fluid">
    <!-- Page Heading -->
    <h1 class="h3 mb-4 text-gray-800">Add Users</h1>

    <a href="{% url 'list_users' %}" class="btn btn-secondary btn-icon-split mb-4">
        <span class="icon text-white">
            <i class="fas fa-chevron-left"></i>
        </span>
        <span class="text">Back</span>
    </a>
    <div class="col-lg-5 p-0">
        <form action="{% url 'add_user' guard_id department_id %}" method="POST">
            {% csrf_token %}
            <div class="card">
                <h5 class="card-header">Users Master Data</h5>
                <div class="card-body">
                    <h5 class="card-title">Add New Users</h5>
                    <p class="card-text">Form to add new users to system</p>
                    <div class="form-group row">
                        <label for="u_username" class="col-form-label col-lg-4">Username</label>
                        <div class="col p-0">
                            <input type="text" readonly class="form-control-plaintext col-lg" name="u_username" id="u_username" value="{{ username }}">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="u_password" class="col-form-label col-lg-4">Password</label>
                        <div class="col p-0">
                            <input type="password" class="form-control col-lg" name="password" id="u_password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success btn-icon-split mt-4 float-right">
                        <span class="icon text-white">
                            <i class="fas fa-plus-circle"></i>
                        </span>
                        <span class="text">Add to system</span>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
<!-- /.container-fluid -->
{% endblock main_content %}
