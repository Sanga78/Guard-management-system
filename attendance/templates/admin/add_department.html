{% extends 'includes/base.html' %}
{%block main_content %}
<!-- Begin Page Content -->
        <div class="container-fluid">

            <!-- Page Heading -->
            <h1 class="h3 mb-4 text-gray-800">Add Department</h1>
  
            <a href="{% url 'departments' %}" class="btn btn-secondary btn-icon-split mb-4">
              <span class="icon text-white">
                <i class="fas fa-chevron-left"></i>
              </span>
              <span class="text">Back</span>
            </a>
            <div class="col-lg-5 offset-lg-4">
              {% for m in messages %}
              {% if m.tags == 'error' %}
              
              <div class="alert alert-danger alert-dismissible fade show"><strong>Info: </strong>{{m}}
              <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                  <span aria-hidden="true">&times;</span>
              </button>
          
              </div>
               {%endif%}
              {%endfor%}
            </div>
            <form action="" method="POST" class="col-lg-5  p-0">
              {% csrf_token %}
              <div class="card">
                <h5 class="card-header">Department Master Data</h5>
                <div class="card-body">
                  <h5 class="card-title">Add New Department</h5>
                  <p class="card-text">Form to add new department to system</p>
                  <form>
                    <div class="form-group">
                      <label for="d_id" class="col-form-label-lg">Department ID</label>
                      <input type="text" class="form-control form-control-lg" name="deptcode" id="d_id">
                    </div>
                    <div class="form-group">
                      <label for="d_name" class="col-form-label-lg">Department Name</label>
                      <input type="text" class="form-control form-control-lg" name="deptname" id="d_name">
                    </div>
                    <button type="submit" class="btn btn-success btn-icon-split mt-4 float-right">
                      <span class="icon text-white">
                        <i class="fas fa-plus-circle"></i>
                      </span>
                      <span class="text">Add to system</span>
                    </button>
                  </form>
                </div>
              </div>
            </form>
          </div>
          <!-- /.container-fluid -->
{%endblock main_content %}
